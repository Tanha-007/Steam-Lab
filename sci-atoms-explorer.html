<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom Explorer - STEM HoloVerse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Animation definition */
        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .lab-canvas {
            height: 480px; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 15px;
            position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Orbit path */
        .orbit-path {
            position: absolute; width: 320px; height: 320px;
            border: 2px dashed #cbd5e1; border-radius: 50%;
            /* Animation is applied here */
            animation: rotateOrbit 8s linear infinite;
            animation-play-state: running; /* Controlled by JS */
        }

        /* Electron on the orbit */
        .electron-node {
            width: 20px; height: 20px; background: #facc15; border: 2px solid #ca8a04;
            border-radius: 50%; position: absolute; top: -11px; left: 50%;
            margin-left: -10px; cursor: pointer; box-shadow: 0 0 15px rgba(250, 204, 21, 0.8);
            z-index: 15;
        }

        /* Nucleus styling */
        .nucleus-hub {
            width: 100px; height: 100px; background: #fee2e2; border: 3px solid #ef4444;
            border-radius: 50%; display: flex; flex-wrap: wrap; justify-content: center;
            align-content: center; gap: 5px; z-index: 10; cursor: pointer;
        }

        .part {
            width: 28px; height: 28px; border-radius: 50%; color: white;
            font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center;
        }
        .p-red { background: #ef4444; }
        .n-gray { background: #94a3b8; }

        /* Control Button */
        .control-btn {
            position: absolute; bottom: 20px; right: 20px;
            padding: 10px 20px; background: #3b82f6; color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            transition: 0.3s; z-index: 20;
        }
        .control-btn:hover { background: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <a href="lab.html" class="btn" style="background:#64748b">← Back</a>
    <h2>Atom Explorer</h2>

    <div class="lab-canvas" id="chem-canvas">
        <button class="control-btn" id="toggleBtn" onclick="toggleMotion()">Pause Motion</button>

        <div class="orbit-path" id="mainOrbit">
            <div class="electron-node" onclick="setAtomMsg('Electron', 'Negative (–)', 'Electrons are subatomic particles that orbit the nucleus. Their movement and arrangement determine how atoms react chemically.')"></div>
        </div>

        <div class="nucleus-hub" onclick="setAtomMsg('Nucleus', 'Positive (+)', 'The nucleus is the small, dense region at the center of an atom consisting of protons and neutrons.')">
            <div class="part p-red" onclick="event.stopPropagation(); setAtomMsg('Proton', 'Positive (+)', 'Protons are found in the nucleus. The number of protons is the Atomic Number, which identifies the element.')">+</div>
            <div class="part n-gray" onclick="event.stopPropagation(); setAtomMsg('Neutron', 'Neutral (0)', 'Neutrons have no charge. They provide stability to the nucleus by preventing protons from repelling each other.')">0</div>
            <div class="part n-gray" onclick="event.stopPropagation(); setAtomMsg('Neutron', 'Neutral (0)', 'Neutrons carry a neutral charge and contribute to the atom\'s mass.')">0</div>
            <div class="part p-red" onclick="event.stopPropagation(); setAtomMsg('Proton', 'Positive (+)', 'A proton is a stable subatomic particle with a positive electrical charge.')">+</div>
        </div>
    </div>

    <div class="info-panel" id="chem-info" style="margin-top:20px; padding:20px; background:#f1f5f9; border-left:6px solid #3b82f6; text-align:left; border-radius:10px; font-family: sans-serif;">
        <div id="atom-text">
            <b>Atom Explorer Active:</b> Click on any particle or use the button to control the electron's motion.
        </div>
    </div>
</div>

<script>
    let isMoving = true;

    function toggleMotion() {
        const orbit = document.getElementById('mainOrbit');
        const btn = document.getElementById('toggleBtn');
        
        if (isMoving) {
            orbit.style.animationPlayState = 'paused';
            btn.innerText = 'Start Motion';
            btn.style.background = '#10b981'; // Green for Start
        } else {
            orbit.style.animationPlayState = 'running';
            btn.innerText = 'Pause Motion';
            btn.style.background = '#3b82f6'; // Blue for Pause
        }
        isMoving = !isMoving;
    }

    function setAtomMsg(name, charge, desc) {
        const infoDiv = document.getElementById('atom-text');
        infoDiv.innerHTML = `
            <h3 style="margin:0; color:#1e293b;">${name}</h3>
            <p style="margin:5px 0;"><b>Charge:</b> ${charge}</p>
            <p style="margin:0; color:#475569;">${desc}</p>
        `;
        
        const panel = document.getElementById('chem-info');
        if(name === 'Proton') panel.style.borderLeftColor = '#ef4444';
        else if(name === 'Electron') panel.style.borderLeftColor = '#facc15';
        else if(name === 'Neutron') panel.style.borderLeftColor = '#94a3b8';
        else panel.style.borderLeftColor = '#3b82f6';
    }
</script>
</body>
</html>
