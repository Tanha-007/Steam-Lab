<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detailed H2O Formation</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lab-container { position: relative; height: 400px; background: #f0f9ff; border-radius: 30px; border: 3px solid #bae6fd; overflow: hidden; }
        .atom { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .o { width: 100px; height: 100px; background: #ef4444; top: 150px; left: 45%; transform: translateX(-50%); font-size: 1.5rem; z-index: 5; }
        .h { width: 60px; height: 60px; background: #3b82f6; font-size: 1rem; z-index: 10; }
        #h1 { top: 50px; left: 10%; }
        #h2 { bottom: 50px; left: 10%; }
        .electron { width: 14px; height: 14px; background: #facc15; border-radius: 50%; position: absolute; border: 2px solid #ca8a04; transition: 1.5s; }
        #e1, #e2 { right: -8px; top: 22px; }
        .water-drop { font-size: 8rem; display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; }
        .info-panel { margin-top: 20px; padding: 20px; background: white; border-radius: 15px; border-left: 5px solid #3b82f6; }
        .sharing { box-shadow: 0 0 25px #facc15 !important; }
    </style>
</head>
<body>
    <div class="container">
        <a href="science.html" class="btn" style="background:#64748b">← Back</a>
        <h2>Covalent Bonding: Making H₂O</h2>

        <div class="lab-container">
            <div id="o-atom" class="atom o">O</div>
            <div id="h1" class="atom h">H <div id="e1" class="electron"></div></div>
            <div id="h2" class="atom h">H <div id="e2" class="electron"></div></div>
            <div id="drop" class="water-drop">💧</div>
        </div>

        <div class="info-panel" id="instruction">
            <strong>Initial State:</strong> Hydrogen atoms tader 1-ti kore electron Oxygen-er sathe share korte prostut!
        </div>

        <button class="btn" id="stepBtn" onclick="runH2OProcess()" style="margin-top:20px; background:#3b82f6;">Step 1: Get Closer</button>

        <div id="congrats" class="congrats">
            <h1>🎉 H₂O Molecule Ready!</h1>
            <p>Ekhane electron <b>Share</b> hoyeche. Ekei bole <b>Covalent Bond</b>!</p>
            <button class="btn" onclick="location.reload()">Re-run Experiment</button>
        </div>
    </div>

    <script>
        let currentStep = 0;
        function runH2OProcess() {
            const h1 = document.getElementById('h1'), h2 = document.getElementById('h2'), o = document.getElementById('o-atom');
            const e1 = document.getElementById('e1'), e2 = document.getElementById('e2');
            const info = document.getElementById('instruction'), btn = document.getElementById('stepBtn');
            currentStep++;

            if(currentStep === 1) {
                h1.style.left = "38%"; h1.style.top = "110px";
                h2.style.left = "38%"; h2.style.top = "230px";
                info.innerHTML = "<strong>Step 1:</strong> Hydrogen atom gulo Oxygen er kache asche bond toiri korar jonno.";
                btn.innerText = "Step 2: Share Electrons";
            } else if(currentStep === 2) {
                h1.style.left = "42%"; h1.style.top = "130px";
                h2.style.left = "42%"; h2.style.top = "210px";
                e1.style.transform = "translateX(5px)"; e2.style.transform = "translateX(5px)";
                h1.classList.add('sharing'); h2.classList.add('sharing'); o.classList.add('sharing');
                info.innerHTML = "<strong>Step 2:</strong> Dekho! Electron gulo ekhon shared obosthay ache.";
                btn.innerText = "Step 3: Complete Molecule";
            } else if(currentStep === 3) {
                h1.style.opacity = "0"; h2.style.opacity = "0"; o.style.opacity = "0";
                document.getElementById('drop').style.display = "block";
                info.innerHTML = "<strong>Step 3:</strong> Amra pelam ekta stable Water (H₂O) molecule.";
                setTimeout(() => { document.getElementById('congrats').classList.add('show'); }, 1000);
            }
        }
    </script>
</body>
</html>
